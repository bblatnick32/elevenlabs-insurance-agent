name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
      - run: uv run verify doctor
      - run: uv run python -m unittest discover -s tests
      - run: uv run ruff format --check
      - run: uv run ruff check --output-format=github
      - run: uv run basedpyright
      - run: uv run verify api suite
      # The suite writes evidence before it exits non-zero, so keep it on failure too.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-suite
          path: artifacts/api-suite/
          if-no-files-found: ignore

  agent-tests:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ env.ELEVENLABS_API_KEY != '' }}
        run: npm install --global @elevenlabs/cli@1.3.1
      - if: ${{ env.ELEVENLABS_API_KEY != '' }}
        run: >-
          elevenlabs agents test
          "$(jq -r '.agents[0].id' agents.json)"
          --intent "run attached policy servicing tests in CI"
      - if: ${{ env.ELEVENLABS_API_KEY == '' }}
        run: echo "ELEVENLABS_API_KEY is not configured; skipping native agent tests"
